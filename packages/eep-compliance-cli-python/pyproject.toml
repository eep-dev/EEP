[project]
name = "eep-compliance-cli"
version = "0.1.0"
description = "EEP conformance test runner for any platform"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.scripts]
eep-compliance = "eep_compliance_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
