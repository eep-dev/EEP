[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-compliance-cli"
readme = "README.md"
version = "0.1.0"
description = "EEP conformance test runner for any platform"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.scripts]
eep-compliance = "eep_compliance_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://eep.dev"
Source = "https://github.com/eep-dev/EEP"
Issues = "https://github.com/eep-dev/EEP/issues"
Documentation = "https://github.com/eep-dev/EEP#readme"
Changelog = "https://github.com/eep-dev/EEP/blob/main/CHANGELOG.md"
