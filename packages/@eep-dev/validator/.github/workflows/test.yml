name: "@eep-dev/validator Tests"

on:
  push:
    paths: ['EEP/packages/@eep-dev/validator/**']
  pull_request:
    paths: ['EEP/packages/@eep-dev/validator/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install
        working-directory: EEP/packages/@eep-dev/validator
        run: npm ci
      - name: Test
        working-directory: EEP/packages/@eep-dev/validator
        run: npx vitest run
