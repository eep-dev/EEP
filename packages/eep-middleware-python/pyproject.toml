[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-middleware"
version = "0.1.0"
description = "Framework adapters and server utilities for integrating EEP into existing Python services."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    # Gate resolution + SSRF validation are shared with the TypeScript middleware.
    # In the monorepo these resolve to the sibling packages installed editable
    # (see test.sh / CI). When published they resolve from PyPI.
    "eep-gates>=0.1.0",
    "eep-validator>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=eep_middleware --cov-branch --cov-report=term-missing --cov-fail-under=100"

[project.urls]
Homepage = "https://eep.dev"
Source = "https://github.com/eep-dev/EEP"
Issues = "https://github.com/eep-dev/EEP/issues"
Documentation = "https://github.com/eep-dev/EEP#readme"
Changelog = "https://github.com/eep-dev/EEP/blob/main/CHANGELOG.md"
