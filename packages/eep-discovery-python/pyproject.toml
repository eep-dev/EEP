[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-discovery"
version = "0.1.0"
description = "EEP discovery utilities — manifest validation, Link header parsing, DNS TXT record parsing"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
