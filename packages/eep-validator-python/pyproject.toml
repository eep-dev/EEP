[project]
name = "eep-validator"
version = "0.1.0"
description = "SSRF prevention and payload validation for EEP publishers"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://eep.dev"
Source = "https://github.com/eep-dev/EEP"
Issues = "https://github.com/eep-dev/EEP/issues"
Documentation = "https://github.com/eep-dev/EEP#readme"
Changelog = "https://github.com/eep-dev/EEP/blob/main/CHANGELOG.md"
