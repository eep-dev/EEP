[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-mcp-bridge"
version = "0.1.0"
description = "MCP to EEP bridge utilities and reference HTTP bridge server."
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0.0"]

[project.scripts]
eep-mcp-bridge = "eep_mcp_bridge.cli:main"

[project.urls]
Homepage = "https://eep.dev"
Source = "https://github.com/eep-dev/EEP"
Issues = "https://github.com/eep-dev/EEP/issues"
Documentation = "https://github.com/eep-dev/EEP#readme"
Changelog = "https://github.com/eep-dev/EEP/blob/main/CHANGELOG.md"
