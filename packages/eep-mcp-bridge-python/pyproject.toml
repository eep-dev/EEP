[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-mcp-bridge"
version = "0.1.0"
description = "MCP to EEP bridge utilities and reference HTTP bridge server."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0.0"]

[project.scripts]
eep-mcp-bridge = "eep_mcp_bridge.cli:main"
