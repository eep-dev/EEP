name: EEP Release — Publish npm + PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # e.g. v0.1.0, v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'     # pre-releases: v0.1.0-alpha.1

permissions:
  contents: write        # required for GitHub Release creation
  id-token: write        # reserved for future PyPI trusted publishing migration

jobs:
  # ── Verify all tests pass before any publish step ─────────────────────────
  preflight:
    name: Preflight — all tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # TS packages
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test schema suite
        run: npm ci && npx vitest run
        working-directory: tests

      - name: Test @eep-dev/gates
        run: npm ci && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/gates

      - name: Test @eep-dev/signer
        run: npm ci && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/signer

      - name: Test @eep-dev/validator
        run: npm ci && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/validator

      - name: Test @eep-dev/compliance-cli
        run: npm ci && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/compliance-cli

      - name: Test @eep-dev/discovery
        run: npm install && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/discovery

      - name: Test @eep-dev/mcp-bridge
        run: |
          (cd ../../packages/@eep-dev/gates && npm ci && npm run build)
          npm install && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/mcp-bridge

      - name: Test @eep-dev/middleware
        run: |
          (cd ../../packages/@eep-dev/gates && npm ci && npm run build)
          npm install && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/middleware

      - name: Test @eep-dev/setup-cli
        run: npm install && npx vitest run --reporter=dot
        working-directory: packages/@eep-dev/setup-cli

      - name: npm high-severity audit gate
        run: |
          set -euo pipefail
          for dir in \
            "packages/@eep-dev/gates" \
            "packages/@eep-dev/signer" \
            "packages/@eep-dev/validator" \
            "packages/@eep-dev/compliance-cli" \
            "packages/@eep-dev/setup-cli" \
            "packages/@eep-dev/middleware" \
            "tests" \
            "examples/node-gate-publisher"
          do
            echo "Auditing $dir"
            (cd "$dir" && npm ci && npm audit --omit=dev --audit-level=high)
          done
          echo "Auditing packages/@eep-dev/discovery"
          (cd "packages/@eep-dev/discovery" && npm install && npm audit --omit=dev --audit-level=high)
          echo "Auditing packages/@eep-dev/mcp-bridge"
          (cd "packages/@eep-dev/mcp-bridge" && npm install && npm audit --omit=dev --audit-level=high)

      # Python packages
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test eep-gates-python
        run: pip install -e '.[dev]' && PYTHONPATH=. python -m pytest tests/ -v
        working-directory: packages/eep-gates-python

      - name: Test eep-signer-python
        run: pip install pytest && PYTHONPATH=. python -m pytest tests/ -v
        working-directory: packages/eep-signer-python

      - name: Test eep-validator-python
        run: pip install pytest pytest-asyncio && PYTHONPATH=. python -m pytest tests/ -v
        working-directory: packages/eep-validator-python

      - name: Test eep-compliance-cli-python
        run: pip install httpx pytest && PYTHONPATH=. python -m pytest tests/ -v
        working-directory: packages/eep-compliance-cli-python

      - name: Test eep-discovery-python
        run: pip install pytest && PYTHONPATH=. python -m pytest tests/ -v
        working-directory: packages/eep-discovery-python

      - name: Test eep-mcp-bridge-python
        run: pip install -e '.[dev]' && PYTHONPATH=. python -m pytest tests/ -q --no-header --no-summary
        working-directory: packages/eep-mcp-bridge-python

      - name: Test eep-middleware-python
        run: pip install -e '.[dev]' && python -m pytest -q
        working-directory: packages/eep-middleware-python

      # @eep-dev/gates ships TypeScript only; dist/ is gitignored. The example resolves
      # file:../../packages/@eep-dev/gates → dist/index.js must exist before start.
      - name: Build @eep-dev/gates
        working-directory: packages/@eep-dev/gates
        run: |
          npm ci
          npm run build

      - name: pip vulnerability audit gate
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          pip install --upgrade pip pip-audit
          pip-audit -r tests/cross-impl/requirements.txt
          pip install \
            ./packages/eep-gates-python \
            ./packages/eep-signer-python \
            ./packages/eep-validator-python \
            ./packages/eep-compliance-cli-python \
            ./packages/eep-discovery-python \
            ./packages/eep-mcp-bridge-python \
            ./packages/eep-middleware-python
          pip-audit

      - name: Start node gate publisher for cross-impl tests
        run: |
          npm install
          npx tsx server.ts > /tmp/eep-gate-publisher.log 2>&1 &
          echo "PUBLISHER_PID=$!" >> $GITHUB_ENV
        working-directory: examples/node-gate-publisher

      - name: Wait for publisher readiness
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:3002/.well-known/eep.json" > /dev/null; then
              echo "Publisher is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Publisher failed to start"
          cat /tmp/eep-gate-publisher.log || true
          exit 1

      - name: Run cross-implementation protocol tests
        run: |
          pip install -r tests/cross-impl/requirements.txt
          EEP_BASE_URL=http://localhost:3002 python -m pytest tests/cross-impl -v

      - name: Stop publisher
        if: always()
        run: |
          if [ -n "${PUBLISHER_PID:-}" ]; then
            kill "$PUBLISHER_PID" || true
          fi

  # ── npm publish (TypeScript packages) ─────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish @eep-dev/gates
        run: |
          npm ci
          npm run build
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/gates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eep-dev/signer
        run: |
          npm ci
          npm run build
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/signer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eep-dev/validator
        run: |
          npm ci
          npm run build
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/validator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eep-dev/compliance-cli
        run: |
          npm ci
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/compliance-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eep-dev/discovery
        run: |
          npm install
          npm run build
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/discovery
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eep-dev/mcp-bridge
        run: |
          npm install
          npm run build
          npm pack --dry-run
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public
        working-directory: packages/@eep-dev/mcp-bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── PyPI publish (Python packages via OIDC trusted publishing) ───────────
  publish-pypi:
    name: Publish PyPI packages
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: pypi
      url: https://pypi.org/p/eep-protocol
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and publish eep-gates-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-gates-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish eep-signer-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-signer-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish eep-validator-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-validator-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish eep-compliance-cli-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-compliance-cli-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish eep-discovery-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-discovery-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish eep-mcp-bridge-python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml
          python -m build
          twine upload dist/*
        working-directory: packages/eep-mcp-bridge-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── GitHub Release creation ────────────────────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish-npm
      - publish-pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version and changelog
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            {
              echo "Release v$VERSION"
              echo
              echo "No exact changelog section matched this tag. See CHANGELOG.md for details."
            } > release_notes.txt
          fi
          echo "NOTES_FILE=release_notes.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "EEP v${{ steps.meta.outputs.VERSION }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
