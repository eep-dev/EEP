name: EEP Tests

on:
  push:
    branches: [main]
  pull_request:
    # Every pull request is tested, not only those targeting `main`.
    # Stacked PRs (where one change is based on the branch of another so the
    # diffs stay reviewable) previously got no checks at all, which is
    # precisely when a reviewer most wants them.
    branches: ['**']

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build @eep-dev/gates (for examples and cross-impl)
        working-directory: packages/@eep-dev/gates
        run: |
          npm ci
          npm run build

      - name: npm high-severity audit gate (published packages — blocking)
        run: |
          set -euo pipefail
          # Only packages we publish to npm gate the build: a high-severity
          # advisory in one of these ships to consumers. Examples and the test
          # harness are audited in a separate, non-blocking step below — a vuln
          # in a demo's transitive dependency must not block every contributor
          # PR (it previously blocked main and 8 PRs over a hono advisory in
          # examples/node-gate-publisher).
          for dir in \
            "packages/@eep-dev/gates" \
            "packages/@eep-dev/signer" \
            "packages/@eep-dev/validator" \
            "packages/@eep-dev/compliance-cli" \
            "packages/@eep-dev/setup-cli" \
            "packages/@eep-dev/middleware"
          do
            echo "Auditing $dir"
            (cd "$dir" && npm ci && npm audit --omit=dev --audit-level=high)
          done
          echo "Auditing packages/@eep-dev/discovery"
          (cd "packages/@eep-dev/discovery" && npm install && npm audit --omit=dev --audit-level=high)
          echo "Auditing packages/@eep-dev/mcp-bridge"
          (cd "packages/@eep-dev/mcp-bridge" && npm install && npm audit --omit=dev --audit-level=high)

      - name: npm audit (examples + test harness — advisory, non-blocking)
        continue-on-error: true
        run: |
          # These are not published to npm. High-severity transitive advisories
          # here are surfaced as warnings but do NOT fail CI.
          for dir in \
            "tests" \
            "examples/node-gate-publisher"
          do
            echo "::group::Advisory audit $dir"
            if (cd "$dir" && npm ci && npm audit --omit=dev --audit-level=high); then
              echo "$dir: no high-severity advisories"
            else
              echo "::warning title=Advisory audit::$dir has high-severity advisories (non-blocking: not a published package)"
            fi
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pip vulnerability audit gate
        run: |
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          pip install --upgrade pip pip-audit
          pip-audit -r tests/cross-impl/requirements.txt
          pip install \
            ./packages/eep-gates-python \
            ./packages/eep-signer-python \
            ./packages/eep-validator-python \
            ./packages/eep-compliance-cli-python \
            ./packages/eep-discovery-python \
            ./packages/eep-mcp-bridge-python \
            ./packages/eep-middleware-python
          pip-audit

  test-schemas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run

  test-validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/validator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run --coverage

  test-signer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/signer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run --coverage

  test-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/gates
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run --coverage

  test-compliance-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/compliance-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --coverage
      # Exercise the published entry point in offline mode. This is what a
      # downstream implementor runs against the released vector tarball, so
      # a break here means the shipped CLI is broken even though the unit
      # tests pass.
      - name: Replay conformance vectors through the built CLI (--fixtures)
        working-directory: .
        run: node packages/@eep-dev/compliance-cli/dist/index.js --fixtures ./tests/conformance-fixtures

  test-discovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/discovery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx vitest run --coverage

  test-mcp-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/mcp-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build @eep-dev/gates (required by mcp-bridge)
        working-directory: packages/@eep-dev/gates
        run: |
          npm ci
          npm run build
      - run: npm install
      - run: npx vitest run --coverage

  test-setup-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/setup-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx vitest run --coverage

  test-agent-adopt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/agent-adopt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # @eep-dev/setup-cli ships `types` from dist/; dist/ is gitignored. tsc in agent-adopt
      # must see ../setup-cli/dist (same pattern as test-cross-impl + @eep-dev/gates).
      - name: Build @eep-dev/setup-cli (required by agent-adopt)
        working-directory: packages/@eep-dev/setup-cli
        run: |
          npm install
          npm run build
      - run: npm install
      - run: npm run build
      - run: node dist/index.js --help
      - name: Run agent-adopt vitest suite
        run: npx vitest run

  test-middleware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/@eep-dev/middleware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build workspace dependencies (required by middleware)
        run: |
          for dep in gates signer validator; do
            (cd "../$dep" && npm ci && npm run build)
          done
      - run: npm install
      - run: npx vitest run --coverage

  # ── Python packages ──────────────────────────────────────────

  test-signer-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-signer-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: PYTHONPATH=. python -m pytest tests/ -v

  test-validator-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-validator-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-asyncio
      - run: PYTHONPATH=. python -m pytest tests/ -v

  test-gates-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-gates-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=. python -m pytest tests/ -v

  test-compliance-cli-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-compliance-cli-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install httpx pytest
      - run: PYTHONPATH=. python -m pytest tests/ -v

  test-discovery-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-discovery-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: PYTHONPATH=. python -m pytest tests/ -v

  test-mcp-bridge-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-mcp-bridge-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=. python -m pytest tests/ -q --no-header --no-summary

  test-middleware-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eep-middleware-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Gate resolution + SSRF validation live in sibling packages. Install them
      # editable first so the eep-gates / eep-validator requirements resolve locally
      # instead of from PyPI (mirrors the TS test-middleware workspace build step).
      - run: pip install -e ../eep-gates-python -e ../eep-validator-python
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  test-cross-impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # @eep-dev/gates ships TypeScript only; dist/ is gitignored. The example resolves
      # file:../../packages/@eep-dev/gates → dist/index.js must exist before start.
      - name: Build @eep-dev/gates
        working-directory: packages/@eep-dev/gates
        run: |
          npm ci
          npm run build

      - name: Start Node gate publisher example
        working-directory: examples/node-gate-publisher
        run: |
          npm install
          npx tsx server.ts > /tmp/eep-gate-publisher.log 2>&1 &
          echo "PUBLISHER_PID=$!" >> $GITHUB_ENV

      - name: Wait for publisher readiness
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:3002/.well-known/eep.json" > /dev/null; then
              echo "Publisher is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Publisher failed to start"
          cat /tmp/eep-gate-publisher.log || true
          exit 1

      - name: Run cross-implementation protocol tests
        run: |
          pip install -r tests/cross-impl/requirements.txt
          # Install the Python reference signer so the cross-language signing-parity
          # check runs for real instead of skipping. EEP_REQUIRE_PYTHON_SIGNER=1 turns
          # a missing import into a failure rather than a silent skip.
          pip install ./packages/eep-signer-python
          EEP_REQUIRE_PYTHON_SIGNER=1 EEP_BASE_URL=http://localhost:3002 python -m pytest tests/cross-impl -v

      - name: Stop publisher
        if: always()
        run: |
          if [ -n "${PUBLISHER_PID:-}" ]; then
            kill "$PUBLISHER_PID" || true
          fi

  # ────────────────────────────────────────────────────────────────────
  # DCO sign-off check — every commit on `main` and every PR commit
  # MUST carry a `Signed-off-by:` trailer per the Developer Certificate
  # of Origin v1.1. See CONTRIBUTING.md § Sign-off.
  # ────────────────────────────────────────────────────────────────────
  dco-check:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7 # renovate: pin
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Checking commits in ${BASE_SHA}..${HEAD_SHA}"
          missing=0
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            author=$(git log -1 --pretty=format:'%an <%ae>' "$sha")
            if ! git log -1 --pretty=format:'%B' "$sha" | grep -qiE "^Signed-off-by: .* <.*@.*>"; then
              echo "::error::Commit $sha by $author is missing a Signed-off-by trailer."
              echo "          Use \`git commit --amend -s\` or \`git rebase --signoff\` to fix."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) without DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────
  # Schema → types drift gate
  # ────────────────────────────────────────────────────────────────────
  # The reference stacks ship test suites (Node vitest, Python pytest with a
  # 100% coverage gate) that no job ran. README calls this the stack
  # "contributors and CI use to exercise Layer 1 discovery, Layer 2
  # subscribe/stream, Layer 3 pulse and the gate endpoints" — so it needs to
  # actually run. A subscribe handler reading the wrong request field shipped
  # undetected because nothing here executed these tests.
  test-reference-implementation-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/eep-reference-implementation/node
    steps:
      - uses: actions/checkout@v7 # renovate: pin
      - uses: actions/setup-node@v7 # renovate: pin
        with:
          node-version: '22'
      - name: Build linked workspace dependencies
        run: |
          for dep in gates signer validator; do
            (cd "../../../packages/@eep-dev/$dep" && npm ci && npm run build)
          done
      - run: npm install
      - run: npx vitest run

  test-reference-implementation-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/eep-reference-implementation/python
    steps:
      - uses: actions/checkout@v7 # renovate: pin
      - uses: actions/setup-python@v6 # renovate: pin
        with:
          python-version: '3.11'
      # Install the workspace sources, not the published wheels. Otherwise
      # this job tests whatever is currently on PyPI rather than the tree the
      # PR changes, and a regression here would go unnoticed until release.
      - name: Install workspace EEP packages from source
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../../packages/eep-gates-python
          pip install -e ../../../packages/eep-signer-python
          pip install -e ../../../packages/eep-validator-python
      - run: pip install -e . pytest pytest-cov httpx
      - run: python -m pytest tests/ -q

  # The Internet-Draft is the document this project intends to submit for
  # standardisation. It described a different manifest than the one that
  # ships — different field names, different required set — and nothing
  # compared them. This gate makes that class of drift a build failure.
  draft-schema-parity:
    name: IETF draft ↔ schema parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # renovate: pin
      - uses: actions/setup-node@v7 # renovate: pin
        with:
          node-version: '22'
      - run: node scripts/check-draft-schema-parity.mjs

  schema-types-drift:
    name: Schema types drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # renovate: pin

      - uses: actions/setup-node@v7 # renovate: pin
        with:
          node-version: '22'

      - name: Install codegen dependency
        # Pin BOTH json-schema-to-typescript and prettier to exact versions.
        # jstt formats its output with prettier (dep range "^3.2.5"), so an
        # unpinned install silently adopts new prettier releases and reformats
        # the generated types — drift with no schema change. prettier 3.9.0
        # (2026-06-27) collapsed short union types onto one line and broke this
        # gate on main. The committed tests/types/eep-schemas.d.ts is generated
        # against exactly these versions; bump them here and regenerate together.
        run: npm install --no-save --no-package-lock json-schema-to-typescript@15.0.4 prettier@3.9.0

      - name: Check generated schema types are up to date
        # The script's --check mode generates the output to memory and
        # exits non-zero if it differs from the committed
        # tests/types/eep-schemas.d.ts. Crucially, it also fails if the
        # committed file is missing — git diff alone would silently let
        # an untracked file pass.
        run: node scripts/codegen-schema-types.mjs --check
