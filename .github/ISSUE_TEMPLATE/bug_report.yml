name: Bug report
description: Report incorrect behavior in spec text, tooling, tests, or examples (not security — see SECURITY.md).
labels: ['triage']
body:
  - type: markdown
    attributes:
      value: |
        **Security issues:** do not report here. Use [SECURITY.md](https://github.com/eep-dev/EEP/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, file paths, or spec section references.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit (if applicable)
      description: e.g. EEP spec v0.1, @eep-dev/gates 0.x.x, or git SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node or Python version, browser — whatever helps narrow the bug.
