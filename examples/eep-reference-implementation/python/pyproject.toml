[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-api-python-reference"
version = "0.1.0"
description = "FastAPI reference deployment for EEP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "eep-gates @ file:../../../packages/eep-gates-python",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0"
]
